[project]
name = "pyconde-talks"
version = "0.1.0"
description = "Website for conference talks"
readme = "README.md"
requires-python = ">=3.14,<4"
authors = [{ name = "Julio Batista Silva", email = "python@juliobs.com" }]
license = "MIT"
keywords = [
    "conference",
    "django",
    "event",
    "pycon",
    "pyconde",
    "pydata",
    "speaker",
    "talks",
    "videos",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django :: 6",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "daphne>=4.2.3",
    "django-allauth[socialaccount]>=65.19.1",
    "django-anymail[mailgun]>=15.1",
    "django-environ>=0.14.0",
    "django-health-check[psutil]>=4.5.0",
    "django-htmx>=1.29.0",
    "django-markdownify>=0.9.7",
    "django-structlog>=10.1.0",
    "django-stubs-ext>=6.1.0",
    "django>=6.1",
    "emoji>=2.15.0",
    "furl>=2.1.4",
    "httpx2>=2.10.0",
    "matplotlib>=3.11.1",
    "model-bakery>=1.24.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pilmoji>=2.0.5",
    "pydantic>=2.13.4",
    "sentry-sdk[django]>=2.68.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "bandit[sarif]>=1.9.4",
    "django-stubs[compatible-mypy]>=6.1.0",
    "djlint>=1.44.2",
    "faker>=40.36.0",
    "ipython>=9.16.1",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "prek>=0.4.13",
    "ruff>=0.16.3",
    "zizmor>=1.29.0",
    "zuban>=0.9.1",
]
test = [
    "hypothesis>=6.165.5",
    "inline-snapshot>=0.35.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-httpx2>=1.0.0",
    "pytest-mock>=3.15.1",
    "pytest-random-order>=1.2.0",
]
prod = [
    # psycopg3 (a.k.a. `psycopg`) is the actively-maintained successor to psycopg2.
    # ``[binary]`` ships its own libpq wheel so the Docker image does not need libpq-dev.
    # Add the ``pool`` extra to enable Django's native connection pool (`DJANGO_DB_POOL=True`).
    "psycopg[binary]>=3.3.4",
    # Client for Django's built-in RedisCache (`DJANGO_CACHE_URL=redis://...`). Django ships the
    # backend itself, so django-redis is not needed - only the driver.
    "redis>=8.1.0",
]
docs = [
    "zensical>=0.0.54",
]

[project.urls]
Homepage = "https://github.com/PioneersHub/pyconde-talks"
Documentation = "https://pioneershub.github.io/pyconde-talks/"
Repository = "https://github.com/PioneersHub/pyconde-talks"
CI = "https://github.com/PioneersHub/pyconde-talks/actions"
Issues = "https://github.com/PioneersHub/pyconde-talks/issues"

[tool.uv]
exclude-newer = "1 day"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[tool.zuban]
strict = true
disallow_untyped_defs = true
warn_unreachable = true
python_executable = ".venv/bin/python"

[tool.django-stubs]
django_settings_module = "event_talks.settings"

[tool.djlint]
profile = "django"
indent = 2
line_length = 100
ignore = "H014,H021"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
extend-exclude = ["migrations"]
fix = true
unsafe-fixes = false

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class
    "D212",   # multi-line-summary-first-line
    "D413",   # blank-line-after-last-section: docformatter strips it, so the two would fight
    "ANN401", # Allow Any type annotations in certain cases
    "COM812", # Conflicts with the formatter
    # The MIT license lives in LICENSE at the repo root and is declared in [project]; this project
    # deliberately does not repeat a copyright header in every source file.
    "CPY001", # missing-copyright-notice
]

[tool.ruff.lint.per-file-ignores]
"**/tests/{test_*.py,conftest.py}" = [
    "ARG001",  # Allow unused arguments in tests (for pytest fixtures)
    "ARG002",  # Allow unused method arguments in tests (for pytest fixtures)
    "PLR0913", # Allow many arguments in test helpers
    "PLR0917", # Same, counted positionally: pytest injects fixtures as positional parameters
    "S101",    # Allow assert in tests
    "S105",    # Allow hardcoded password in strings tests
    "S106",    # Allow hardcoded password in function calls in tests
    "S107",    # Allow hardcoded default password in tests
    "SLF001",  # Allow private member access in tests
]
"**/__init__.py" = [
    "D104", # Allow empty __init__.py files
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2

[tool.docformatter]
# Reflow docstrings to the project's 100-column width, so text that fits on one line stays on one
# line instead of wrapping early. `pre-summary-newline` keeps the summary on the second line to
# match the active D213 (the D212 alternative is ignored above). The pre-commit hook passes
# `--in-place` and the staged filenames; a bare `docformatter <dir>` only prints a diff.
#
# No `exclude` here on purpose: docformatter's exclude breaks out of the whole directory walk on the
# first match instead of skipping that one directory (PyCQA/docformatter util.py `find_py_files`),
# so it silently drops every file after it. Exclusions live in .pre-commit-config.yaml instead, and
# a manual run should name source directories rather than `.` (which would descend into `.venv`).
recursive = true
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "event_talks.settings"
python_files = ["test_*.py"]
# pytest-httpx2 defines this marker in its plugin, but its entry point only exposes the httpx2_mock
# fixture (not pytest_configure), so the marker goes unregistered. Register it here to silence
# PytestUnknownMarkWarning.
markers = [
    "httpx2: configure the pytest-httpx2 httpx2_mock fixture (e.g. assert_all_called=False)",
]
addopts = [
    "-ra",
    "--durations=10",
    "--import-mode=importlib",
    "--random-order",
    "--tb=short",
    "--cov=.",
    "--cov-report=term",
    "--cov-report=lcov:reports/lcov.info",
    "--cov-report=xml:reports/coverage.xml",
    "--verbose",
]

[tool.coverage.run]
omit = [
    "manage.py",
    "event_talks/asgi.py",
    "event_talks/wsgi.py",
    "event_talks/settings.py",
    "*/migrations/*",
    # Live integration tests - module-level `pytest.skip` when RUN_LIVE_IMPORT_TEST is unset
    # leaves their bodies permanently uncovered.
    "talks/tests/test_import_livestream_urls.py",
    "talks/tests/test_import_pretalx_integration.py",
    "talks/tests/test_update_video_links.py",
]

[tool.bandit]
exclude_dirs = [
    ".git",
    ".venv",
    "__pycache__",
    "_fake_talks",
    "generate_fake_talks.py",
    "migrations",
    "tests",
]

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']
