# Build once, deploy to one target per tag.
#
# The codebase serves several event sites (talks.pycon.de, videos.pydata-berlin.org, ...). The
# image is event-agnostic - each site is configured by its own .env on the server - so CI builds
# ONE shared image and deploys that exact git sha to whichever target a tag names.
#
# Trigger: push a tag "<target>/<version>", e.g.
#   git tag talks.pycon.de/2026.06.03 && git push origin talks.pycon.de/2026.06.03
# or run the workflow manually and pick a target.
#
# Flow: parse+validate target -> require the commit to be on main -> quality gate -> build & push
# to GHCR (by git sha) -> manual approval in the target's environment -> trigger the locked-down
# deploy over SSH.
#
# Nothing here touches the server's shell. The target is pinned per key in the server's
# authorized_keys forced command ("deploy-event <target>"); CI controls only the git sha.
# See docs/deployment/ci-cd.md.
name: deploy

on:
  push:
    tags:
      # <target>/<version>. One pattern per target, kept in step with the ALLOWED list in the
      # setup job, which also covers workflow_dispatch (no tag pattern filters that path).
      - "talks.pycon.de/*"
      - "videos.pydata-berlin.org/*"
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - talks.pycon.de
          - videos.pydata-berlin.org

# Nothing by default; each job asks for exactly what it needs. A job added later without its own
# block therefore gets no token scopes rather than the repository default.
permissions: {}

jobs:
  setup:
    name: Resolve deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout
    outputs:
      target: ${{ steps.parse.outputs.target }}
      version: ${{ steps.parse.outputs.version }}
      registry: ${{ steps.parse.outputs.registry }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The main-ancestry gate below needs the commit graph, and actions/checkout only fetches
          # every branch (so origin/main exists locally) when fetch-depth is 0.
          fetch-depth: 0
          persist-credentials: false

      - name: Parse and validate target
        id: parse
        env:
          # Space-separated allowlist. To add a site: add it here, create a GitHub Environment
          # named exactly after it, add it to the workflow_dispatch choices above, and set up the
          # server (see docs/deployment/ci-cd.md).
          ALLOWED: "talks.pycon.de videos.pydata-berlin.org"
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TARGET: ${{ inputs.target }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            target="$INPUT_TARGET"
            version="manual-${GITHUB_SHA::12}"
          else
            # Tag push: REF_NAME is "<target>/<version>".
            target="${REF_NAME%/*}"
            version="${REF_NAME##*/}"
          fi
          case " $ALLOWED " in
            *" $target "*) ;;
            *) echo "::error::Unknown deploy target '${target}' (allowed: ${ALLOWED})"; exit 1 ;;
          esac
          owner_lc="$(echo "$OWNER" | tr 'A-Z' 'a-z')"
          {
            echo "target=${target}"
            echo "version=${version}"
            echo "registry=ghcr.io/${owner_lc}"
            echo "tag=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying ${target} (version ${version}) at ${GITHUB_SHA::12}"
          # The approver only sees this run page, so put what they are approving on it.
          {
            echo "### Deploy to \`${target}\`"
            echo ""
            echo "| Field | Value |"
            echo "| ----- | ----- |"
            echo "| Target | \`${target}\` |"
            echo "| Version | \`${version}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image tag | \`${GITHUB_SHA::12}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require the commit to be on main
        # A tag can point at any commit, on any branch, reviewed or not, and pushing one is enough
        # to start a deploy. Green checks are not review, so refuse anything main does not already
        # contain. Rolling back by tagging an older good commit still works: it is on main too.
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main was not fetched; cannot verify the commit is on main"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of main; only merged commits deploy"
            exit 1
          fi
          echo "${GITHUB_SHA} is on main"

  checks:
    needs: setup # fail a bad target before spending a full test run on it
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  build:
    name: Build and push images
    needs: [setup, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the shared app and static images to GHCR
      id-token: write # sign the build provenance attestations
      attestations: write # record them against this repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Exposes ACTIONS_* tokens so the raw `docker buildx bake` below can use the
      # GitHub Actions layer cache (type=gha).
      - name: Expose GitHub Actions cache tokens
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push shared app image + static assets
        id: bake
        working-directory: docker
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.tag }}
          # Both end up as OCI labels, so a pulled image says which commit and which deploy tag
          # produced it. IMAGE_TAG holds only the short sha.
          REVISION: ${{ github.sha }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx bake --allow=fs.read=.. \
            --metadata-file /tmp/bake-metadata.json \
            --set '*.output=type=registry' \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'
          # Read back what was actually pushed, rather than restating the image names the bake file
          # already owns. The digest is the subject of the attestation below: a tag can be moved by
          # anything holding packages:write, a digest cannot. "%:*" drops the tag.
          app="$(jq -r '.django."image.name"' /tmp/bake-metadata.json)"
          static="$(jq -r '."staticfiles-export"."image.name"' /tmp/bake-metadata.json)"
          {
            echo "app_name=${app%:*}"
            echo "static_name=${static%:*}"
            echo "app_digest=$(jq -r '.django."containerimage.digest"' /tmp/bake-metadata.json)"
            echo "static_digest=$(jq -r '."staticfiles-export"."containerimage.digest"' /tmp/bake-metadata.json)"
          } >> "$GITHUB_OUTPUT"

      # Publishes a signed statement that this repository, at this commit, produced these exact
      # digests, to the attestation API and to the registry alongside the image. The server can
      # then check the provenance of what it pulled with `gh attestation verify`; see
      # docs/deployment/ci-cd.md.
      - name: Attest the app image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.bake.outputs.app_name }}
          subject-digest: ${{ steps.bake.outputs.app_digest }}
          push-to-registry: true

      - name: Attest the static assets image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.bake.outputs.static_name }}
          subject-digest: ${{ steps.bake.outputs.static_digest }}
          push-to-registry: true

  deploy:
    name: Deploy
    needs: [setup, build]
    runs-on: ubuntu-latest
    # An unreachable server would otherwise hang ssh for the runner's full 6 hours while holding
    # the concurrency group below, blocking every later deploy to the same target.
    timeout-minutes: 20
    permissions: {} # this job never checks out and never calls the API
    # One deploy per target at a time; different targets can deploy in parallel.
    concurrency:
      group: deploy-${{ needs.setup.outputs.target }}
      cancel-in-progress: false
    # Gate: the environment is named after the target and requires a manual approval
    # (configure a required reviewer in Settings -> Environments -> <target>).
    environment:
      name: ${{ needs.setup.outputs.target }}
      url: https://${{ needs.setup.outputs.target }}
    steps:
      - name: Configure SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Trigger remote deploy
        # The server key is pinned to "deploy-event <target>", so DEPLOY_TAG is the only thing CI
        # controls. The script validates it as a git sha before acting.
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_TAG: ${{ needs.setup.outputs.tag }}
        # StrictHostKeyChecking is set explicitly: ssh's default ("ask") happens to fail closed on
        # a runner with no tty, so an empty SSH_KNOWN_HOSTS is already refused, but that is a side
        # effect of the environment rather than a guarantee. The timeouts keep a silent server or a
        # dropped connection from hanging the job instead of failing it.
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "${SSH_USER}@${SSH_HOST}" "${DEPLOY_TAG}"
