# Reusable quality gate: lint, format, type check, tests.
# Called by ci.yml (on PRs) and by deploy.yml (before any image is built or deployed).
name: checks

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        # dev (ruff/zuban), test (pytest), and prod (psycopg) so every import resolves.
        # --no-build: every dependency must ship a prebuilt wheel.
        run: uv sync --all-groups --locked --no-build

      # Every "uv run" below repeats --no-build so a re-sync can never build from source.
      - name: Lint (ruff)
        run: uv run --no-build ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run --no-build ruff format --check .

      - name: Type check (zuban)
        run: uv run --no-build zuban check

      - name: Tests (pytest)
        # Defaults are CI-safe: SQLite DB, plain StaticFilesStorage, unsafe-secret-key.
        run: |
          mkdir -p reports
          uv run --no-build pytest
