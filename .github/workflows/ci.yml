# Continuous integration for pull requests.
# Deploys never run from here; see deploy.yml for the main-branch path.
name: ci

on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    # "$/" is GitHub's self-repository form: it resolves against this repository at the commit that
    # triggered the run, instead of against whatever the runner happens to have checked out. That
    # counts as a pin, which the workspace-relative "./" form does not.
    #
    # NOSONAR: S7637 wants a full commit SHA, but a same-repository reference has no ref to pin.
    uses: $/.github/workflows/checks.yml # NOSONAR
