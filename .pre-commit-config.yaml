repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      - id: uv-lock

  # Docformatter: reflow docstrings to the full 100 columns instead of wrapping early.
  # See [tool.docformatter] in pyproject.toml. Must run before ruff, which formats the code
  # around the docstrings. Only migrations are excluded: Django generates them, so they are not
  # ours to restyle.
  #
  # Note for new code: until PyCQA/docformatter#364 ships, a triple-quoted string that is not a
  # docstring (a verbose regex, a SQL block) is read as one and reflowed into broken syntax.
  # Write those as concatenated single-line strings instead of excluding the file, or the file
  # loses docstring formatting along with it.
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        args: [--in-place, --config, ./pyproject.toml]
        exclude: /migrations/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/djlint/djLint
    rev: v1.45.0
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        exclude: ^docs/ # docs/ uses the mkdocs flavor below
        additional_dependencies:
          - mdformat-gfm # GitHub Flavored Markdown support
          - mdformat-frontmatter # Don't mess with YAML front matter blocks
      - id: mdformat
        name: mdformat (docs)
        files: ^docs/ # Zensical sources: admonitions and content tabs need the mkdocs plugin
        additional_dependencies:
          - mdformat-mkdocs # MkDocs/Material syntax (admonitions, content tabs, 4-space lists)
          - mdformat-frontmatter # Don't mess with YAML front matter blocks

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.1.0
    hooks:
      - id: cspell # Spell check changed files
      - id: cspell # Spell check the commit message
        name: check commit message spelling
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
          - --files
          - .git/COMMIT_EDITMSG
        stages: [commit-msg]
        always_run: true

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py314-plus]

  # Renovate config validator. Catches a typo in renovate.json5 before it silently breaks updates.
  # rev is Renovate's bare semver with NO "v" prefix; Renovate keeps it bumped via the pre-commit
  # manager (it lands in the "pre-commit hooks" group).
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.62.0
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  # Static analysis for the GitHub Actions workflows. Same tool as the zizmor.yml workflow, so a
  # finding shows up here first instead of on a red CI run.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: zuban
        name: zuban type check
        entry: zuban check
        language: system
        types: [python]
        pass_filenames: true
